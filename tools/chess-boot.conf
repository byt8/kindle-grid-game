# chess-boot.conf -- boot the Kindle straight into the game.
#
# Installed as /etc/upstart/chess.conf. The root partition has to be writable
# to copy it in:
#
#     mntroot rw
#     cp /mnt/us/chess-boot.conf /etc/upstart/chess.conf
#     mntroot ro
#
# To undo (the game is then started only by hand):
#
#     mntroot rw; rm /etc/upstart/chess.conf; mntroot ro
#
# The game's own runner (/mnt/us/chess-run.sh, pushed from tools/kindle-run.sh)
# does the screen takeover and puts the reader back when the game exits, so
# tapping GIVE UP on the board, or the game crashing, always leaves a usable
# Kindle. That is the only way out of the game, so it is left in place on
# purpose.

start on started lab126_gui
stop on runlevel [06]

script
    # wifid rejoins the remembered network by itself a few seconds after boot;
    # if the game's own picker saved one first, that is tried too. Waiting here
    # means a normal boot never stops at the wi-fi screen -- the reader UI is
    # still up while this runs, so the wait looks like a normal start.
    i=0
    while [ $i -lt 20 ]; do
        if [ -x /mnt/us/chess-wifi.sh ] && sh /mnt/us/chess-wifi.sh status >/dev/null 2>&1
        then
            break
        fi
        i=$((i + 1))
        sleep 1
    done
    [ -x /mnt/us/chess-wifi.sh ] && sh /mnt/us/chess-wifi.sh auto >/dev/null 2>&1

    GAME=chess exec sh /mnt/us/chess-run.sh --conf /mnt/us/chess.conf
end script

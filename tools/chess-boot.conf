# chess-boot.conf -- boot the Kindle straight into the game.
#
# Installed as /etc/upstart/chess.conf. mntroot/initctl are not on ssh's PATH,
# so use full paths:
#
#     /usr/sbin/mntroot rw
#     cp /mnt/us/chess-boot.conf /etc/upstart/chess.conf
#     sync; /usr/sbin/mntroot ro
#
# To undo (the game is then started only by hand):
#
#     /usr/sbin/mntroot rw; rm /etc/upstart/chess.conf; /usr/sbin/mntroot ro
#
# The rule this job obeys: give Wi-Fi time to finish on its own before taking
# the screen. The game stops the `framework` job to own the panel, and killing
# that job while wifid is still associating leaves the Kindle with no link, so
# the wait comes first.
#
# The wait is 180s, then the game starts anyway. It has to: a gift Kindle has no
# remembered network yet, and waiting longer would never succeed -- the screen
# where you join a network is inside the game. The game's own Wi-Fi setup calls
# chess-wifi.sh, which brings the link up with wpa_cli + udhcpc and does not
# need the framework. So: no link is not a dead end, it is the game's first job.
#
# set +e is not decoration. Upstart runs script blocks with `sh -e`, and the
# loop calls chess-wifi.sh, which exits non-zero for "not connected yet" -- an
# unguarded failure there killed the whole job silently on the first boot this
# was installed on. Every expected-to-fail call is guarded too.
#
# Everything is logged to /mnt/us/chess-boot.log: the interesting failures
# happen when there is no shell to watch them.
#
# The game's runner (/mnt/us/chess-run.sh, pushed from tools/kindle-run.sh)
# starts the framework again when the game exits, so tapping QUIT then GIVE UP
# -- or the game crashing -- always leaves a usable Kindle.

start on started lab126_gui
stop on runlevel [06]

script
    set +e
    LOG=/mnt/us/chess-boot.log
    # The clock is meaningless until Wi-Fi has set it, so log uptime as well:
    # it is the only timestamp that tells you how far into boot this was.
    echo "=== chess boot $(date) uptime $(cat /proc/uptime) ===" > $LOG
    WAIT=180

    # No blanket/progress-bar handling here on purpose. The splash process is
    # owned by the `x` job, and the game stops that job itself once it owns the
    # panel (see chess.c). Killing blanket here instead makes lxinit exit
    # abnormally, x_monitor restarts the entire GUI, and after five restarts it
    # reboots the device into repair mode.

    if [ -x /mnt/us/chess-wifi.sh ]; then
        i=0
        while [ $i -lt $WAIT ]; do
            if sh /mnt/us/chess-wifi.sh status >/dev/null 2>&1; then
                echo "wifi up after ${i}s" >> $LOG
                sh /mnt/us/chess-wifi.sh status >> $LOG 2>&1
                break
            fi
            # wifid rejoins the Kindle's own remembered network by itself; the
            # `auto` retry covers a network saved by the game's picker.
            if [ $((i % 30)) -eq 0 ]; then
                sh /mnt/us/chess-wifi.sh auto >> $LOG 2>&1
            fi
            i=$((i + 5))
            sleep 5
        done
        if [ $i -ge $WAIT ]; then
            echo "no wifi after ${WAIT}s: starting the game, which has its own setup" >> $LOG
        fi
    else
        echo "no /mnt/us/chess-wifi.sh, starting the game anyway" >> $LOG
    fi

    echo "starting the game" >> $LOG
    GAME=chess exec sh /mnt/us/chess-run.sh --conf /mnt/us/chess.conf
end script

# menu-boot.conf -- boot the Kindle into the last game that was open.
#
# Installed as /etc/upstart/menu.conf (the installer does this):
#
#     /usr/sbin/mntroot rw
#     cp /mnt/us/menu-boot.conf /etc/upstart/menu.conf
#     rm -f /etc/upstart/chess.conf        # the old direct-to-chess job
#     sync; /usr/sbin/mntroot ro
#
# The stop stanza (runlevel [06] only) deliberately overrides upstart's
# default stop on runlevel [06], so stopping the `x` or `lab126_gui` jobs
# in a normal boot session -- which the session does -- never kills this
# job. The menu session only ends via its own script (KINDLE button) or at
# shutdown; it has no `start` dependency on any other job and one instance
# running cannot be re-triggered by repeated `started lab126_gui` emissions
# when a game's runner restores the reader between games.
#
# Same trigger as the old chess job: the reader coming up is the signal the
# panel can be taken. The session script (menu-boot.sh) owns the screen from
# then until the KINDLE button or shutdown, launching the chosen game and
# re-taking the panel when the game quits, so the Amazon UI is not visible
# beyond the first frames of boot.

start on started lab126_gui
stop on runlevel [06]

script
    set +e
    # The session below must never stay dead: it is what opens the last game
    # after a crash or a kill over ssh. It only ends for real when QUIT (or a
    # guard exit) writes /mnt/us/.menu-stop. This loop honours that instead of
    # starting the game again on top of the reader. Next boot deletes the
    # stamp and opens the saved game.
    while :; do
        rm -f /mnt/us/.menu-stop
        sh /mnt/us/menu-boot.sh
        [ -e /mnt/us/.menu-stop ] && break
        sleep 2
    done
end script
